name: Sora V2 Cloudflare Preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sora-v2-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/feat/sora-v2-foundation' || github.ref == 'refs/heads/feat/sora-v2-m1' || github.ref == 'refs/heads/feat/sora-v2-m2'
    runs-on: ubuntu-latest
    environment: cloudflare-preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Upload a preview version (does not promote production)
        run: pnpm --filter @sora/web cf:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
